name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Copiar o app para www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r icons www/icons

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ajustes (permissões, ícones, assinatura)
        run: bash native/prepare-android.sh

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MEDICAMENTO.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MEDICAMENTO (APK mais recente)
          body: "Build ${{ github.run_number }} — commit ${{ github.sha }}"
          files: MEDICAMENTO.apk
          make_latest: true
