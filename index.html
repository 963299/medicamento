<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>MEDICAMENTO</title>
<meta name="theme-color" content="#0A0E16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E16;
    --surface:#121926;
    --surface-2:#182233;
    --line: rgba(255,255,255,0.08);
    --cyan:#3FD8E8;
    --cyan-dim: rgba(63,216,232,0.14);
    --mint:#6EE7C8;
    --amber:#F5A83C;
    --amber-dim: rgba(245,168,60,0.14);
    --red:#FF5C6C;
    --red-dim: rgba(255,92,108,0.14);
    --text:#E7EDF3;
    --text-dim:#8B98AC;
    --text-faint:#5B6577;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 50% -10%, rgba(63,216,232,0.10), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:100px;
  }
  h1,h2,h3,.num,.clock{font-family:'Space Grotesk', sans-serif;}

  /* ---------- Top bar ---------- */
  .topbar{
    padding: max(22px, env(safe-area-inset-top)) 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{width:30px; height:30px; border-radius:8px;}
  .brand span{font-weight:700; font-size:15px; letter-spacing:0.04em;}
  .clock-wrap{text-align:right;}
  .clock{font-size:18px; font-weight:600; color:var(--text);}
  .date{font-size:11px; color:var(--text-dim); text-transform:capitalize;}

  main{padding:0 20px; max-width:520px; margin:0 auto;}

  /* ---------- Hero: próxima dose ---------- */
  .hero{
    position:relative;
    border-radius:24px;
    padding:22px 22px 20px;
    margin: 6px 0 22px;
    background: linear-gradient(165deg, var(--surface-2), var(--surface));
    border:1px solid var(--line);
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; top:-60%; right:-30%;
    width:260px; height:260px;
    background: radial-gradient(circle, rgba(63,216,232,0.22), transparent 65%);
    pointer-events:none;
  }
  .hero.overdue{border-color: rgba(255,92,108,0.35);}
  .hero.overdue::before{background: radial-gradient(circle, rgba(255,92,108,0.22), transparent 65%);}
  .hero-label{
    font-size:11px; font-weight:600; letter-spacing:0.06em;
    color:var(--cyan); text-transform:uppercase;
    display:flex; align-items:center; gap:6px;
  }
  .hero.overdue .hero-label{color:var(--red);}
  .dot{width:6px;height:6px;border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor;}
  .hero-name{font-size:24px; font-weight:700; margin:10px 0 2px; position:relative;}
  .hero-detail{font-size:13.5px; color:var(--text-dim); position:relative;}
  .hero-bottom{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-top:18px; position:relative;
  }
  .countdown{font-size:34px; font-weight:700; line-height:1;}
  .countdown .unit{font-size:13px; color:var(--text-dim); font-weight:500; margin-left:4px;}
  .take-btn{
    background:var(--cyan); color:#062024; border:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600; font-size:14.5px;
    padding:13px 22px; border-radius:14px;
    display:flex; align-items:center; gap:8px;
    cursor:pointer; transition: transform .15s ease, opacity .15s ease;
  }
  .take-btn:active{transform:scale(0.95); opacity:0.85;}
  .hero.overdue .take-btn{background:var(--red); color:#2A0407;}
  .empty-hero{text-align:center; padding:30px 10px;}
  .empty-hero .big{font-size:15px; color:var(--text-dim);}

  /* ---------- Lista ---------- */
  .section-label{
    font-size:12px; font-weight:600; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:0.06em;
    margin: 4px 2px 10px;
  }
  .list{display:flex; flex-direction:column; gap:10px;}
  .item{
    display:flex; align-items:center; gap:13px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:13px 14px;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
  }
  .item.taken-flash{background: var(--cyan-dim); border-color: rgba(63,216,232,0.35);}
  .item.late{border-color: rgba(255,92,108,0.3);}
  .thumb{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; overflow:hidden;
  }
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .item-mid{flex:1; min-width:0;}
  .item-name{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-detail{font-size:12.5px; color:var(--text-dim); margin-top:2px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .badge{
    font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:20px;
    background:var(--amber-dim); color:var(--amber);
  }
  .badge.red{background:var(--red-dim); color:var(--red);}
  .item-time{font-size:13px; color:var(--text-dim); font-weight:500; text-align:right; flex-shrink:0;}
  .item.late .item-time{color:var(--red);}
  .check-btn{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    border:1.5px solid var(--line); background:transparent;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); cursor:pointer;
  }
  .check-btn:active{transform:scale(0.9);}
  .del-btn{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    border:none; background:transparent;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); cursor:pointer;
  }
  .del-btn:active{transform:scale(0.9); color:var(--red);}
  .hero-del{
    position:absolute; top:18px; right:18px;
    width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.06); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .hero-del:active{transform:scale(0.9);}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty-state svg{margin-bottom:14px; opacity:0.5;}
  .empty-state p{font-size:14px; line-height:1.5;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:18px;
    background:var(--cyan); color:#062024; border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 30px rgba(63,216,232,0.35);
    cursor:pointer; z-index:20;
  }
  .fab:active{transform:scale(0.92);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(4,6,10,0.7);
    backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--surface); width:100%; max-width:520px;
    border-radius:26px 26px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    border-top:1px solid var(--line);
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 16px;}
  .sheet h2{font-size:19px; margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text); font-family:'IBM Plex Sans', sans-serif;
    font-size:15px; padding:12px 13px; border-radius:12px; outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--cyan);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .chip{
    padding:8px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); font-size:13px;
    cursor:pointer; font-weight:500;
  }
  .chip.active{background:var(--cyan-dim); border-color:var(--cyan); color:var(--cyan);}
  .photo-input{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-2); border:1px dashed var(--line);
    border-radius:12px; padding:12px; cursor:pointer;
  }
  .photo-input .ph-thumb{
    width:40px;height:40px;border-radius:10px;background:var(--surface);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  }
  .photo-input .ph-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-input span{font-size:13px; color:var(--text-dim);}
  .save-btn{
    width:100%; background:var(--cyan); color:#062024; border:none;
    font-weight:600; font-size:15.5px; padding:15px; border-radius:14px;
    margin-top:6px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif;
  }
  .save-btn:active{opacity:0.85;}
  .cancel-link{
    display:block; text-align:center; color:var(--text-dim);
    font-size:13.5px; margin-top:14px; background:none; border:none; width:100%; padding:6px;
  }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:12px 18px; border-radius:14px; font-size:13.5px;
    display:flex; align-items:center; gap:8px;
    opacity:0; transition:all .3s ease; z-index:60; pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

  <div id="heroWrap"></div>
  <div id="listWrap"></div>

<button class="fab" id="openAdd" aria-label="Adicionar medicamento">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="#062024" stroke-width="2.4" stroke-linecap="round"/></svg>
</button>

<!-- Modal: adicionar medicamento -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Novo medicamento</h2>

    <div class="field">
      <label>Nome do medicamento</label>
      <input type="text" id="f_nome" placeholder="Ex: Losartana">
    </div>

    <div class="field">
      <label>Forma</label>
      <div class="chips" id="formaChips">
        <div class="chip active" data-val="comprimido">Comprimido</div>
        <div class="chip" data-val="capsula">Cápsula</div>
        <div class="chip" data-val="gotas">Gotas</div>
        <div class="chip" data-val="ml">ml (xarope/líquido)</div>
        <div class="chip" data-val="injecao">Injeção</div>
        <div class="chip" data-val="outro">Outro</div>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Qtd. por dose</label>
        <input type="number" id="f_qtdDose" placeholder="Ex: 1" min="0" step="0.5">
      </div>
      <div class="field">
        <label>Intervalo (horas)</label>
        <input type="number" id="f_intervalo" placeholder="Ex: 8" min="1" step="1">
      </div>
    </div>
    <div class="chips" id="intervaloChips" style="margin:-6px 0 14px;">
      <div class="chip" data-val="6">6/6h</div>
      <div class="chip" data-val="8">8/8h</div>
      <div class="chip" data-val="12">12/12h</div>
      <div class="chip" data-val="24">24/24h</div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Primeira dose</label>
        <input type="time" id="f_horaInicio">
      </div>
      <div class="field">
        <label>Estoque total disponível</label>
        <input type="number" id="f_estoque" placeholder="Ex: 30" min="0" step="0.5">
      </div>
    </div>

    <div class="field">
      <label>Duração do tratamento (dias) — opcional</label>
      <input type="number" id="f_dias" placeholder="Deixe em branco se for uso contínuo" min="1" step="1">
    </div>

    <div class="field">
      <label>Foto do medicamento — opcional</label>
      <label class="photo-input" id="photoLabel">
        <div class="ph-thumb" id="phThumb">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 16l4.5-5 3.5 4 3-3.5L20 16M4 8h16M4 8a2 2 0 012-2h2l1.5-2h5L16 6h2a2 2 0 012 2M4 8v10a2 2 0 002 2h12a2 2 0 002-2V8" stroke="#5B6577" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span id="photoLabelText">Anexar foto</span>
        <input type="file" accept="image/*" capture="environment" id="f_foto" style="display:none;">
      </label>
    </div>

    <button class="save-btn" id="saveBtn">Salvar medicamento</button>
    <button class="cancel-link" id="cancelBtn">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Estado ============ */
const STORAGE_KEY = 'medicamento_v1';
let state = load();
let selectedForma = 'comprimido';
let photoDataUrl = null;

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { meds: [] };
  }catch(e){ return { meds: [] }; }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ============ Helpers ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function fmtCountdown(ms){
  const overdue = ms < 0;
  const abs = Math.abs(ms);
  const totalMin = Math.floor(abs/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin % 60;
  let str = h > 0 ? `${h}h ${m}min` : `${m}min`;
  return { str, overdue };
}
function formaLabel(m){
  const map = {
    comprimido:['comprimido','comprimidos'], capsula:['cápsula','cápsulas'],
    gotas:['gota','gotas'], ml:['ml','ml'],
    injecao:['aplicação','aplicações'], outro:['unidade','unidades']
  };
  const [sing, plur] = map[m.forma] || ['unidade','unidades'];
  const label = m.qtdDose > 1 ? plur : sing;
  const qtd = m.qtdDose % 1 === 0 ? m.qtdDose : m.qtdDose.toFixed(1);
  return `${qtd} ${label}`;
}
function formaIcon(f){
  return { comprimido:'💊', capsula:'💊', gotas:'💧', ml:'🧴', injecao:'💉', outro:'🩹' }[f] || '💊';
}
function dosesRestantes(m){
  if(!m.qtdDose || m.qtdDose<=0) return Infinity;
  return Math.floor((m.estoque||0) / m.qtdDose);
}
function estoqueBaixo(m){
  const restantes = dosesRestantes(m);
  if(restantes === Infinity) return false;
  const diasCobertos = (restantes * m.intervalo) / 24;
  // Avisa se o estoque acaba em até 2 dias, ou se acaba antes do fim do tratamento
  if(diasCobertos <= 2) return true;
  if(m.diasTratamento){
    const diasRestantesTratamento = diasTratamentoRestantes(m);
    return diasCobertos < diasRestantesTratamento;
  }
  return false;
}
function diasTratamentoRestantes(m){
  if(!m.diasTratamento) return Infinity;
  const fimTratamento = m.criadoEm + m.diasTratamento*24*3600*1000;
  return Math.max(0, (fimTratamento - Date.now()) / (24*3600*1000));
}
function tratamentoConcluido(m){
  if(!m.diasTratamento) return false;
  return Date.now() > m.criadoEm + m.diasTratamento*24*3600*1000;
}

/* ============ Notificações / alarme ============ */
let notifTimers = {};
if('Notification' in window && Notification.permission === 'default'){
  // pede permissão discretamente após pequena interação
  document.addEventListener('click', function reqOnce(){
    Notification.requestPermission();
    document.removeEventListener('click', reqOnce);
  }, {once:true});
}
function scheduleAlarm(med){
  if(notifTimers[med.id]) clearTimeout(notifTimers[med.id]);
  const delay = med.proximaDose - Date.now();
  if(delay <= 0 || delay > 2147000000) return; // limite do setTimeout
  notifTimers[med.id] = setTimeout(() => {
    fireAlarm(med);
  }, delay);
}
function fireAlarm(med){
  const fresh = state.meds.find(m => m.id === med.id);
  if(!fresh) return;
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('Hora do medicamento', {
        body: `${fresh.nome} — ${formaLabel(fresh)}`,
        icon: 'icons/icon-192.png',
        tag: fresh.id
      });
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  render();
}
function rescheduleAllAlarms(){
  Object.values(notifTimers).forEach(t => clearTimeout(t));
  notifTimers = {};
  state.meds.forEach(m => { if(!tratamentoConcluido(m)) scheduleAlarm(m); });
}

/* ============ Ações ============ */
function confirmarDose(id){
  const m = state.meds.find(x => x.id === id);
  if(!m) return;

  m.estoque = Math.max(0, (m.estoque||0) - m.qtdDose);
  m.historico = m.historico || [];
  m.historico.push(Date.now());
  m.proximaDose = Date.now() + m.intervalo*3600*1000;

  save();
  scheduleAlarm(m);

  const card = document.querySelector(`[data-id="${id}"]`);
  if(card) card.classList.add('taken-flash');

  showToast(`${m.nome} registrado ✓`);
  setTimeout(render, 260);
}

function abrirModal(){
  document.getElementById('overlay').classList.add('show');
  const now = new Date();
  document.getElementById('f_horaInicio').value =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
function fecharModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('f_nome').value = '';
  document.getElementById('f_qtdDose').value = '';
  document.getElementById('f_intervalo').value = '';
  document.getElementById('f_estoque').value = '';
  document.getElementById('f_dias').value = '';
  document.getElementById('f_foto').value = '';
  photoDataUrl = null;
  document.getElementById('phThumb').innerHTML = document.getElementById('phThumb').innerHTML;
  document.getElementById('photoLabelText').textContent = 'Anexar foto';
  document.getElementById('phThumb').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 16l4.5-5 3.5 4 3-3.5L20 16M4 8h16M4 8a2 2 0 012-2h2l1.5-2h5L16 6h2a2 2 0 012 2M4 8v10a2 2 0 002 2h12a2 2 0 002-2V8" stroke="#5B6577" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  selectedForma = 'comprimido';
  document.querySelectorAll('#formaChips .chip').forEach(c => c.classList.toggle('active', c.dataset.val==='comprimido'));
  document.querySelectorAll('#intervaloChips .chip').forEach(c => c.classList.remove('active'));
}

function salvarMedicamento(){
  const nome = document.getElementById('f_nome').value.trim();
  const qtdDose = parseFloat(document.getElementById('f_qtdDose').value);
  const intervalo = parseFloat(document.getElementById('f_intervalo').value);
  const estoque = parseFloat(document.getElementById('f_estoque').value) || 0;
  const diasTratamento = parseInt(document.getElementById('f_dias').value) || null;
  const horaInicio = document.getElementById('f_horaInicio').value;

  if(!nome){ showToast('Informe o nome do medicamento'); return; }
  if(!qtdDose || qtdDose<=0){ showToast('Informe a quantidade por dose'); return; }
  if(!intervalo || intervalo<=0){ showToast('Informe o intervalo entre doses'); return; }

  let proximaDose = Date.now();
  if(horaInicio){
    const [hh,mm] = horaInicio.split(':').map(Number);
    const d = new Date();
    d.setHours(hh, mm, 0, 0);
    if(d.getTime() < Date.now()) d.setDate(d.getDate()+1);
    proximaDose = d.getTime();
  }

  const med = {
    id: uid(),
    nome, forma: selectedForma, qtdDose, intervalo, estoque, diasTratamento,
    foto: photoDataUrl,
    proximaDose,
    criadoEm: Date.now(),
    historico: []
  };
  state.meds.push(med);
  save();
  scheduleAlarm(med);
  fecharModal();
  showToast(`${nome} adicionado`);
  render();
}

function excluirMedicamento(id){
  state.meds = state.meds.filter(m => m.id !== id);
  save();
  if(notifTimers[id]) clearTimeout(notifTimers[id]);
  render();
}

function pedirExclusao(id, nome){
  if(confirm(`Excluir ${nome} da lista? O histórico e o lembrete dele serão apagados.`)){
    excluirMedicamento(id);
    showToast(`${nome} excluído`);
  }
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============ Render ============ */
function render(){
  const ativos = state.meds.filter(m => !tratamentoConcluido(m));
  ativos.sort((a,b) => a.proximaDose - b.proximaDose);

  const heroWrap = document.getElementById('heroWrap');
  const listWrap = document.getElementById('listWrap');

  if(ativos.length === 0){
    heroWrap.innerHTML = '';
    listWrap.innerHTML = `
      <div class="empty-state">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" stroke="#5B6577" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="#5B6577" stroke-width="1.5"/></svg>
        <p>Nenhum medicamento cadastrado.<br>Toque no + para começar.</p>
      </div>`;
    return;
  }

  const [top, ...rest] = ativos;
  const cd = fmtCountdown(top.proximaDose - Date.now());
  heroWrap.innerHTML = `
    <div class="hero ${cd.overdue ? 'overdue' : ''}">
      <button class="hero-del" onclick="pedirExclusao('${top.id}', '${escapeHtml(top.nome).replace(/'/g,"\\'")}')" aria-label="Excluir medicamento">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="hero-label"><span class="dot"></span>${cd.overdue ? 'Atrasado' : 'Próxima dose'}</div>
      <div class="hero-name">${escapeHtml(top.nome)}</div>
      <div class="hero-detail">${formaLabel(top)} · às ${fmtTime(top.proximaDose)}${estoqueBaixo(top) ? ' · <span style="color:var(--amber)">estoque baixo</span>' : ''}</div>
      <div class="hero-bottom">
        <div class="countdown">${cd.overdue ? '+' : ''}${cd.str.split(' ')[0]}<span class="unit">${cd.str.split(' ')[1]||''}</span></div>
        <button class="take-btn" onclick="confirmarDose('${top.id}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tomei
        </button>
      </div>
    </div>
  `;

  listWrap.innerHTML = (rest.length ? `<div class="section-label">Em seguida</div>` : '') + `
    <div class="list">
      ${rest.map(m => itemHtml(m)).join('')}
    </div>
  `;
}

function itemHtml(m){
  const now = Date.now();
  const late = m.proximaDose < now;
  const restantes = dosesRestantes(m);
  return `
    <div class="item ${late ? 'late' : ''}" data-id="${m.id}">
      <div class="thumb">${m.foto ? `<img src="${m.foto}">` : formaIcon(m.forma)}</div>
      <div class="item-mid">
        <div class="item-name">${escapeHtml(m.nome)}</div>
        <div class="item-detail">
          <span>${formaLabel(m)} · ${m.intervalo}/${m.intervalo}h</span>
          ${estoqueBaixo(m) ? '<span class="badge">estoque baixo</span>' : ''}
        </div>
      </div>
      <div class="item-time">${late ? 'atrasado' : fmtTime(m.proximaDose)}</div>
      <button class="check-btn" onclick="confirmarDose('${m.id}')" aria-label="Marcar como tomado">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="del-btn" onclick="pedirExclusao('${m.id}', '${escapeHtml(m.nome).replace(/'/g,"\\'")}')" aria-label="Excluir medicamento">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  `;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ Relógio ============ */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('dateLabel').textContent = d.toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'short'});
}
setInterval(() => { tickClock(); render(); }, 15000);
tickClock();

/* ============ Eventos de UI ============ */
document.getElementById('openAdd').addEventListener('click', abrirModal);
document.getElementById('cancelBtn').addEventListener('click', fecharModal);
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') fecharModal();
});
document.getElementById('saveBtn').addEventListener('click', salvarMedicamento);

document.querySelectorAll('#formaChips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#formaChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedForma = chip.dataset.val;
  });
});
document.querySelectorAll('#intervaloChips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#intervaloChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    document.getElementById('f_intervalo').value = chip.dataset.val;
  });
});
document.getElementById('f_foto').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    photoDataUrl = ev.target.result;
    document.getElementById('phThumb').innerHTML = `<img src="${photoDataUrl}">`;
    document.getElementById('photoLabelText').textContent = 'Foto anexada';
  };
  reader.readAsDataURL(file);
});

/* ============ Service worker ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* ============ Init ============ */
rescheduleAllAlarms();
render();
</script>
</body>
</html>
